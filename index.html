<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Real-Time Ludo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="join-screen" class="screen active">
        <div class="card">
            <h1>Modern Ludo</h1>
            <input type="text" id="room-id" placeholder="Enter Room ID (e.g., 'class1')">
            <input type="text" id="player-name" placeholder="Your Name">
            <div class="color-picker">
                <label>Choose Color:</label>
                <div class="colors">
                    <div class="color-opt red active" data-color="red"></div>
                    <div class="color-opt green" data-color="green"></div>
                    <div class="color-opt yellow" data-color="yellow"></div>
                    <div class="color-opt blue" data-color="blue"></div>
                </div>
            </div>
            <button id="join-btn">Join Game</button>
        </div>
    </div>

    <div id="lobby-screen" class="screen">
        <div class="card">
            <h2>Waiting Room</h2>
            <p>Room ID: <span id="lobby-id-display"></span></p>
            <ul id="player-list"></ul>
            <div id="host-controls" style="display:none;">
                <label>Players:</label>
                <select id="player-count-select">
                    <option value="2">2 Players</option>
                    <option value="3">3 Players</option>
                    <option value="4" selected>4 Players</option>
                </select>
                <label>Theme:</label>
                <select id="theme-select">
                    <option value="classic">Classic Board</option>
                    <option value="neon">Dark Neon</option>
                </select>
                <button id="start-game-btn">Start Game</button>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="game-container">
            <div class="board-frame">
                <div id="board">
                    <!-- Top-Left: GREEN -->
                    <div class="base green-base">
                        <div class="inner-base">
                            <div class="base-spot green-spot" id="base-green-0"></div>
                            <div class="base-spot green-spot" id="base-green-1"></div>
                            <div class="base-spot green-spot" id="base-green-2"></div>
                            <div class="base-spot green-spot" id="base-green-3"></div>
                        </div>
                    </div>
                    <!-- Top-Right: YELLOW -->
                    <div class="base yellow-base">
                        <div class="inner-base">
                            <div class="base-spot yellow-spot" id="base-yellow-0"></div>
                            <div class="base-spot yellow-spot" id="base-yellow-1"></div>
                            <div class="base-spot yellow-spot" id="base-yellow-2"></div>
                            <div class="base-spot yellow-spot" id="base-yellow-3"></div>
                        </div>
                    </div>
                    <!-- Bottom-Left: RED -->
                    <div class="base red-base">
                        <div class="inner-base">
                            <div class="base-spot red-spot" id="base-red-0"></div>
                            <div class="base-spot red-spot" id="base-red-1"></div>
                            <div class="base-spot red-spot" id="base-red-2"></div>
                            <div class="base-spot red-spot" id="base-red-3"></div>
                        </div>
                    </div>
                    <!-- Bottom-Right: BLUE -->
                    <div class="base blue-base">
                        <div class="inner-base">
                            <div class="base-spot blue-spot" id="base-blue-0"></div>
                            <div class="base-spot blue-spot" id="base-blue-1"></div>
                            <div class="base-spot blue-spot" id="base-blue-2"></div>
                            <div class="base-spot blue-spot" id="base-blue-3"></div>
                        </div>
                    </div>
                    <!-- Center Home Triangles -->
                    <div class="center-home">
                        <div class="home-triangle green-tri"><span>HOME</span></div>
                        <div class="home-triangle yellow-tri"><span>HOME</span></div>
                        <div class="home-triangle blue-tri"><span>HOME</span></div>
                        <div class="home-triangle red-tri"><span>HOME</span></div>
                    </div>
                </div>
            </div>

            <div class="side-panel">
                <div id="game-log"></div>
                <div id="controls-ui">
                    <div id="turn-indicator">Waiting...</div>
                    <div id="dice-box">-</div>
                    <button id="roll-dice-btn">Roll Dice</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
